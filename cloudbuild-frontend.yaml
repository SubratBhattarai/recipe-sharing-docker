
steps:
  - name: 'gcr.io/cloud-builders/git'
    args: ['clone', 'https://github.com/SubratBhattarai/recipe-sharing-docker.git', '/workspace/source']

  - name: 'gcr.io/cloud-builders/git'
    args: ['-C', '/workspace/source', 'checkout', '--detach', '${_COMMIT_SHA}']

  # 1. Build the frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_URL=https://recipe-backend-74735219876.us-central1.run.app'
      - '-t'
      - 'gcr.io/$PROJECT_ID/recipe-frontend'
      - '/workspace/source/frontend'

  # 2. Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/recipe-frontend'

  # 3. Deploy frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'recipe-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/recipe-frontend'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '80'

options:
  logging: CLOUD_LOGGING_ONLY
