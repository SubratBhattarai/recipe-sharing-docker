
steps:
  - name: 'gcr.io/cloud-builders/git'
    args: ['clone', 'https://github.com/SubratBhattarai/recipe-sharing-docker.git', '/workspace/source']

  - name: 'gcr.io/cloud-builders/git'
    args: ['-C', '/workspace/source', 'checkout', '--detach', '${_COMMIT_SHA}']

  # Build the backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/recipe-backend', '/workspace/source/backend']

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/recipe-backend']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'recipe-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/recipe-backend'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'

# Add logging configuration
options:
  logging: CLOUD_LOGGING_ONLY
